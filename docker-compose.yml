services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_demo_password # demo only
      POSTGRES_DB: auditable_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditable_rag"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
